name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        # The suite needs no API key: LLM behaviour runs against a scripted
        # provider and persistence against throwaway SQLite files.
        run: pytest -q

      - name: Check production preflight reports insecure defaults
        working-directory: backend
        run: |
          python -c "
          from app.core.config import settings
          from app.core.preflight import findings
          names = {f['setting'] for f in findings(settings)}
          assert 'AUTH_ENABLED' in names, 'preflight must flag auth being disabled'
          print('preflight flags:', sorted(names))
          "

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Build
        working-directory: frontend/web
        run: npm run build
